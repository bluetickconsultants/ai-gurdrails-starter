# Personal data redacted in layers/l1_input.py before any model call.
# Order matters: entities run top to bottom on the already-redacted text.
# Patterns are Python regular expressions, single-quoted so backslashes stay literal.
#
# Set `enabled: false` for entities outside your jurisdictions. Japan's My Number has the
# same 12-digit shape as Aadhaar, so enable only the one you need or tighten the patterns.

entities:
  - name: CARD_NUMBER
    jurisdictions: [ALL]
    pattern: '\b(?:\d[ -]?){12,18}\d\b'
  - name: AADHAAR
    jurisdictions: [IN]
    pattern: '\b[2-9]\d{3}[ -]?\d{4}[ -]?\d{4}\b'
  - name: MY_NUMBER
    jurisdictions: [JP]
    enabled: false
    pattern: '\b\d{4}[ -]?\d{4}[ -]?\d{4}\b'
  - name: PAN
    jurisdictions: [IN]
    pattern: '\b[A-Z]{5}\d{4}[A-Z]\b'
  - name: EMAIL
    jurisdictions: [ALL]
    pattern: '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'
  - name: PHONE_IN
    jurisdictions: [IN]
    pattern: '(?:\+91[ -]?)?\b[6-9]\d{9}\b'

# Inputs matching these are rejected outright (input_rejected).
# The default blocks attempts to open or close the structural tags the prompts rely on.
denylist_patterns:
  - '<\s*/?\s*(system|retrieved|retrieved_untrusted|tool_output|source)\b'
